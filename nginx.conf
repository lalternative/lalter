# Static site server for the prerendered TanStack Start output.
#
# The build prerenders every route to its own index.html (see prerender.pages +
# crawlLinks in vite.config.ts), so there is nothing to server-render at
# runtime: no createServerFn, no API route. That is why this image is nginx and
# not a Node server like spore/lungor.

# Run in the foreground; the container is the process supervisor.
daemon off;
pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Unprivileged user cannot write to /var/{cache,log}/nginx, so keep every
  # scratch path under /tmp (writable via an emptyDir/tmpfs at runtime).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile    on;
  tcp_nopush  on;
  server_tokens off;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml application/xml font/woff2;

  server {
    # Must match EXPOSE / the deploy port mapping. >1024 so the unprivileged
    # user can bind it without CAP_NET_BIND_SERVICE.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes/deploy probe target — never cached, no filesystem hit.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Fingerprinted bundles (assets/index-Dldt9sHD.js): the name changes on
    # every content change, so they are safe to cache forever.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Prerendered routes: /pot -> /pot/index.html. Falls back to the 404 page
    # rather than to /index.html, so an unknown URL does not answer 200 with the
    # homepage — that would let search engines index every typo as the home.
    location / {
      try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /index.html;
  }
}
