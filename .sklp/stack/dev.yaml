# yaml-language-server: $schema=https://raw.githubusercontent.com/digstack/skalpai/main/apps/sklp/pipeline/pipeline.schema.json
#
# Local dev stack — `sklp dev stack`. lalter is a single TanStack Start (SSR)
# front-end, no backend or database. One service: web.

version: 1
kind: devstack
name: stack
env_files:
  - .env

services:
  web:
    # MUST bind 0.0.0.0: the probe + host ingress reach web by its bridge IP, so
    # vite's default localhost-only bind is unreachable.
    run: pnpm exec vite dev --host 0.0.0.0 --port 3120
    # port: is the single source of truth for exposure. It drives the host mux
    # and lets ready.http below be written as a bare path.
    port: 3120
    ready:
      http: /
      timeout: 45s
