apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lalter-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # app-of-apps entrypoint: this Application syncs the sibling manifests in
  # this directory (the AppProject and the production Application), so the only
  # thing applied by hand on a fresh cluster is this file:
  #
  #   kubectl apply -f infra/k8s/argocd/app-root.yaml
  project: default
  source:
    repoURL: https://github.com/lalternativefabrique/www.git
    targetRevision: main
    path: infra/k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
