apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lalternative-prod

resources:
  - ../../base-www

patches:
  - path: replicas.yaml
  - path: resources.yaml

images:
  # argocd-image-updater owns this field from here on: it watches the registry
  # and writes newer tags back to main via the .argocd-source override file.
  - name: rg.fr-par.scw.cloud/lalternative/www
    newTag: "20260801-0830-e872dae" # managed by argocd-image-updater

labels:
  - pairs:
      environment: production
    includeSelectors: false
